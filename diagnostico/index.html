<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planeo Score · Descubre cómo ves hoy las finanzas de tu empresa</title>
<meta name="description" content="Autoevaluación gratuita de 3 minutos: tu Planeo Score en 5 áreas de las finanzas de tu empresa.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#3C0078; --purple-mid:#7A3BAA; --purple-light:#F0E8FA;
  --orange:#FF7437; --orange-dark:#CC5A20; --orange-mid:#FF9B6B;
  --text:#363636; --silver:#D4D4D4; --bg:#FAF7FD; --white:#fff;
  --red:#C62828; --amber:#F5A623; --green:#2E7D32;
  --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);line-height:1.5;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{background:var(--purple);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header img{height:26px;width:auto;display:block}
.demo{font:500 11px 'DM Mono',monospace;color:#fff;background:var(--orange-dark);border-radius:99px;padding:3px 10px;display:none}
.demo.on{display:inline-block}
.progress{display:flex;gap:6px;padding:14px 20px 0;max-width:560px;width:100%;margin:0 auto;min-height:20px}
.progress span{flex:1;height:5px;border-radius:9px;background:var(--silver);overflow:hidden;position:relative}
.progress span i{position:absolute;inset:0;background:var(--orange);transform-origin:left;transform:scaleX(0);transition:transform .35s ease}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 20px 40px}
.screen{animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font:500 12px 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--purple-mid);margin:8px 0 6px}
h1,h2{color:var(--purple);line-height:1.2;margin:.2em 0 .5em;font-weight:700}
h1{font-size:28px} h2{font-size:23px}
p{margin:.4em 0 1em}
.lead{font-size:17px}
.stmt{font-size:22px;line-height:1.35;color:var(--text);font-weight:500;margin:6px 0 22px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:17px;text-align:left;width:100%;background:var(--white);color:var(--text);border:2px solid var(--silver);border-radius:var(--radius);padding:15px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s,transform .1s;min-height:56px}
.opt:hover{border-color:var(--purple-mid)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--purple);background:var(--purple-light)}
.opt kbd{font:500 12px 'DM Mono',monospace;color:var(--purple-mid);border:1px solid var(--silver);border-radius:6px;padding:1px 7px;flex:none}
.opt.extra{border-style:dashed;font-size:16px}
.ns{display:block;margin:16px auto 0;background:none;border:0;font:inherit;font-size:15px;color:var(--purple-mid);text-decoration:underline;cursor:pointer;padding:10px}
.ns.sel{color:var(--purple);font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.back{background:none;border:0;font:inherit;color:var(--purple-mid);cursor:pointer;padding:8px 4px;font-size:15px}
.back[hidden]{visibility:hidden;display:block}
.btn{font:inherit;font-weight:700;font-size:17px;background:var(--orange);color:#fff;border:0;border-radius:99px;padding:15px 28px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:background .15s}
.btn:hover{background:var(--orange-dark)}
.btn:disabled{background:var(--silver);cursor:not-allowed}
.btn.block{display:block;width:100%}
.group{margin:0 0 20px}
.group>label,.group>.lab{display:block;font-weight:700;color:var(--purple);margin-bottom:8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;background:var(--white);border:2px solid var(--silver);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip.sel{border-color:var(--purple);background:var(--purple-light);color:var(--purple);font-weight:700}
input[type=text],input[type=email]{font:inherit;font-size:17px;width:100%;border:2px solid var(--silver);border-radius:var(--radius);padding:13px 14px;background:#fff;color:var(--text)}
input:focus,.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.ns:focus-visible,.back:focus-visible{outline:3px solid var(--orange-mid);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0 18px}
.consent input{width:22px;height:22px;margin-top:2px;accent-color:var(--purple);flex:none}
.consent a{color:var(--purple-mid)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{color:var(--red);font-size:14px;min-height:20px;margin:0 0 8px}
.note{font-size:14px;color:#666}
/* Resultado */
.score{text-align:center;margin:6px 0 4px}
.score .lab{font-weight:700;color:var(--purple);font-size:19px}
.score .num{font:500 72px/1 'DM Mono',monospace;color:var(--purple);margin:4px 0}
.attn{text-align:center;font-weight:500;margin:0 0 8px}
.radar{display:block;width:100%;max-width:340px;margin:0 auto}
.axis{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--silver)}
.axis:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.axis b{color:var(--purple)}
.axis .v{font:500 14px 'DM Mono',monospace;color:#666;margin-left:6px}
.axis p{margin:2px 0 0;font-size:15px}
.crit{background:#FFF1EA;border-left:5px solid var(--orange);border-radius:10px;padding:14px 16px;margin:16px 0}
.crit p{margin:0}
.card{background:var(--white);border:1px solid var(--silver);border-radius:var(--radius);padding:16px 18px;margin:16px 0}
.card ul{margin:.4em 0 0;padding-left:20px;font-size:15px}
.rec{background:var(--purple-light);border-radius:var(--radius);padding:16px 18px;margin:16px 0}
.cta{background:var(--purple);color:#fff;border-radius:var(--radius);padding:20px;margin:18px 0}
.cta h2{color:#fff;margin-top:0}
.cta p{color:#EDE3F7}
.disc{font-size:13px;color:#666;border-top:1px solid var(--silver);padding-top:14px;margin-top:22px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #fff;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){h1{font-size:25px}.stmt{font-size:20px}.row2{grid-template-columns:1fr}}
</style>
</head>

    { codigo: 'G1',  eje: 'G',  pol: 'P', extra: 'JOVEN' },
    { codigo: 'G2',  eje: 'G',  pol: 'P' }
  ];

  var UMBRAL_ALERTA = { L: 55, R: 45, RE: 45, E: 45, G: 45 };
  var UMBRAL_ATENCION = 60;
  var PISO = 30;

  var C1_VALORES = ['SI', 'CONSIDERADO', 'NO'];
  var C2_VALORES = ['ALTA', 'MEDIA', 'BAJA']; // confianza autorreportada de la contabilidad

  function itemPorCodigo(c) {
    for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].codigo === c) return ITEMS[i];
    return null;
  }

  function puntosItem(item, valor) {
    switch (valor) {
      case 'A': return item.pol === 'P' ? 2 : 0;
      case 'P': return 1;
      case 'D': return item.pol === 'P' ? 0 : 2;
      case 'NS': return 0;
      case 'ND': return item.extra === 'ND' ? 2 : null;
      case 'JOVEN': return item.extra === 'JOVEN' ? 1 : null;
      default: return null;
    }
  }

  function redondear(x, d) { var m = Math.pow(10, d); return Math.round(x * m + 1e-9) / m; }

  /* Valida respuestas. Devuelve {ok, errores[]}. */
  function validar(respuestas, contexto) {
    var errores = [];
    if (!respuestas || typeof respuestas !== 'object') return { ok: false, errores: ['respuestas'] };
    ITEMS.forEach(function (it) {
      if (puntosItem(it, respuestas[it.codigo]) === null) errores.push(it.codigo);
    });
    if (contexto) {
      if (contexto.C1 != null && C1_VALORES.indexOf(contexto.C1) < 0) errores.push('C1');
      if (contexto.C2 != null && C2_VALORES.indexOf(contexto.C2) < 0) errores.push('C2');
    }
    return { ok: errores.length === 0, errores: errores };
  }

  /* respuestas: {L1:'A',...}; contexto: {C1:'SI|CONSIDERADO|NO', C2:'ALTA|MEDIA|BAJA'} */
  function calcular(respuestas, contexto) {
    contexto = contexto || {};
    var v = validar(respuestas, contexto);
    if (!v.ok) { var e = new Error('Respuestas inválidas: ' + v.errores.join(',')); e.invalidos = v.errores; throw e; }

    var puntosPorItem = {}, pts = { L: 0, R: 0, RE: 0, E: 0, G: 0 }, noSabe = [];
    ITEMS.forEach(function (it) {
      var p = puntosItem(it, respuestas[it.codigo]);
      puntosPorItem[it.codigo] = p;
      pts[it.eje] += p;
      if (respuestas[it.codigo] === 'NS') noSabe.push(it.codigo);
    });

    var eje = {}, suma = 0;
    EJES.forEach(function (k) {
      var norm = pts[k] / 4 * 100;
      eje[k] = redondear(PISO + 0.7 * norm, 1);
      suma += PESOS[k] * Math.log(PISO + 0.7 * norm);
    });
    var ps = redondear(Math.exp(suma), 1);

    var alertas = EJES.filter(function (k) { return eje[k] < UMBRAL_ALERTA[k]; });
    var atencion = EJES.filter(function (k) { return eje[k] < UMBRAL_ATENCION; });

    var tipo = eje.L < UMBRAL_ATENCION ? 'CICLO_CAJA' : 'CFO_EXTERNO';
    var otrosEjes = atencion.filter(function (k) { return k !== 'L'; });

    var valoracion = null;
    if (contexto.C1 && contexto.C1 !== 'NO') {
      valoracion = (contexto.C2 === 'BAJA' || !contexto.C2) ? 'EXPRESS' : 'COMPLETA';
    }

    var utm = tipo === 'CICLO_CAJA' ? 'ciclo-caja' : 'cfo-externo';
    if (valoracion) utm += '_val-' + (valoracion === 'COMPLETA' ? 'completa' : 'express');

    return {
      versionMetodologia: VERSION_METODOLOGIA,
      pts: pts,
      puntosPorItem: puntosPorItem,
      eje: eje,
      planeoScore: ps,
      alertas: alertas,
      atencion: atencion,
      noSabe: noSabe,
      recomendacion: { tipo: tipo, otrosEjes: otrosEjes, valoracion: valoracion, utmContent: utm }
    };
  }

  return {
    VERSION_METODOLOGIA: VERSION_METODOLOGIA, VERSION_FORMULARIO: VERSION_FORMULARIO,
    EJES: EJES, PESOS: PESOS, NOMBRES: NOMBRES, NOMBRES_TECNICOS: NOMBRES_TECNICOS,
    ITEMS: ITEMS, C1_VALORES: C1_VALORES, C2_VALORES: C2_VALORES,
    UMBRAL_ALERTA: UMBRAL_ALERTA, UMBRAL_ATENCION: UMBRAL_ATENCION, PISO: PISO,
    puntosItem: puntosItem, validar: validar, calcular: calcular
  };
});

function radar(r){

  function pt(i,v){ var a=(-90+i*72)*Math.PI/180, rr=(v-30)/70*R; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; }
  function poly(v){ return ks.map(function(_,i){return pt(i,v).map(function(n){return n.toFixed(1);}).join(',');}).join(' '); }
  var svg='<svg class="radar" viewBox="-30 0 400 320" role="img" aria-label="Radar de tus cinco áreas">';
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((60-30)/70*R).toFixed(1)+'" fill="'+'#FF7437'+'" fill-opacity=".12"/>';
  svg+='<polygon points="'+poly(100)+'" fill="none" stroke="#D4D4D4"/>';
  svg+='<polygon points="'+poly(60)+'" fill="none" stroke="#FF9B6B" stroke-dasharray="4 3"/>';
  ks.forEach(function(_,i){ var p=pt(i,100); svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#D4D4D4"/>'; });
  svg+='<polygon points="'+ks.map(function(k,i){return pt(i,r.eje[k]).map(function(n){return n.toFixed(1);}).join(',');}).join(' ')+'" fill="#3C0078" fill-opacity=".22" stroke="#3C0078" stroke-width="2.5" stroke-linejoin="round"/>';
  ks.forEach(function(k,i){
    var p=pt(i,r.eje[k]), crit=r.alertas.indexOf(k)>=0;
    svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(crit?6.5:4.5)+'" fill="'+(crit?'#FF7437':'#3C0078')+'" stroke="#fff" stroke-width="1.5"/>';
    var a=(-90+i*72)*Math.PI/180, lx=cx+(R+16)*Math.cos(a), ly=cy+(R+16)*Math.sin(a);
    var anchor=Math.abs(Math.cos(a))<.2?'middle':(Math.cos(a)>0?'start':'end');
    var partes = TITULOS[k]==='Dependencia y deuda' ? ['Dependencia','y deuda'] : [TITULOS[k]];
    var dy = Math.sin(a)>.5 ? 12 : (Math.sin(a)<-.5 ? -4-(partes.length-1)*13 : 4-(partes.length-1)*6);
    svg+='<text x="'+lx.toFixed(1)+'" y="'+(ly+dy).toFixed(1)+'" text-anchor="'+anchor+'" font-size="13" font-weight="700" fill="'+(crit?'#CC5A20':'#3C0078')+'" font-family="DM Sans,sans-serif">'+
      partes.map(function(t,j){return '<tspan x="'+lx.toFixed(1)+'" dy="'+(j?13:0)+'">'+t+'</tspan>';}).join('')+'</text>';
  });
  return svg+'</svg>';
}
function avisoCritico(r){
  if(!r.alertas.length) return '';
  var al=r.alertas, caja=al.indexOf('L')>=0, otros=al.filter(function(k){return k!=='L';});
  var tit = al.length===1 ? 'Eje crítico: '+TITULOS[al[0]]+' ('+r.eje[al[0]].toFixed(1)+').' : 'Ejes críticos: '+lista(nombres(al))+'.';
  var cuerpo=[];
  if(al.length===1){
    cuerpo.push(caja ? 'Esta área puede comprometer tu operación en cuestión de semanas si no se atiende.' : 'Esta área está frenando el valor de tu empresa más de lo que parece.');
  } else {
    if(caja) cuerpo.push('Caja puede comprometer tu operación en cuestión de semanas si no se atiende.');
    if(otros.length) cuerpo.push(lista(nombres(otros))+(otros.length>1?' están frenando':' está frenando')+' el valor de tu empresa más de lo que parece.');
  }
  cuerpo.push('Conviene actuar pronto: es lo primero que revisaremos contigo en tu sesión sin costo.');
  return '<div class="crit"><p><b>'+tit+'</b> '+cuerpo.join(' ')+'</p></div>';
}
function recomendacion(r){
  var rec=r.recomendacion, o=nombres(rec.otrosEjes), t='';
  if(rec.tipo==='CICLO_CAJA'){
    t='Lo primero que te sugerimos es un <b>Programa de Optimización de Ciclo de Caja</b>: ordenar cobros, pagos y colchón de caja para darle aire a tu negocio.'+(o.length?' Empezaríamos por la caja y, después, '+lista(o)+'.':'');
  } else {
    t='Tu caja está en buen pie. Lo que más valor te daría es un <b>CFO Externo</b>, que trabaje contigo sobre '+(o.length?lista(o):'mantener y crecer lo que ya funciona')+'.';
  }
  if(rec.valoracion) t+=' Como has considerado una venta, un socio o una sucesión, también te recomendamos una <b>Valoración '+(rec.valoracion==='COMPLETA'?'Completa':'Express')+'</b> para conocer cuánto vale hoy tu empresa.';
  return '<div class="rec"><p style="margin:0">'+t+'</p></div>';
}
function pResultado(){
  var r=st.result, ps=r.planeoScore;
  var atn = r.atencion.length ? 'Áreas en atención: '+lista(nombres(r.atencion))+'.' : 'Tus cinco áreas están en buen nivel.';
  var ejes=S.EJES.map(function(k){
    var v=r.eje[k], col = r.alertas.indexOf(k)>=0 ? 'var(--red)' : (v<60 ? 'var(--amber)' : 'var(--green)');
    return '<div class="axis"><span class="dot" style="background:'+col+'"></span><div><b>'+TITULOS[k]+'</b><span class="v">'+v.toFixed(1)+'</span><p>'+LECTURA[k][v<60?1:0]+'</p></div></div>';
  }).join('');
  var ns='';
  if(r.noSabe.length){
    ns='<div class="card"><b>Respondiste «No lo sé» en '+r.noSabe.length+(r.noSabe.length===1?' afirmación':' afirmaciones')+'.</b> No es un error: es una señal. Saber esto con precisión es parte de lo que ordenamos con tus documentos.<ul>'+
      r.noSabe.map(function(c){return '<li>'+HALLAZGO[c]+'</li>';}).join('')+'</ul></div>';
  }
  var href='#';
  if(CONFIG.BOOKINGS_URL) href=CONFIG.BOOKINGS_URL+(CONFIG.BOOKINGS_URL.indexOf('?')>=0?'&':'?')+'utm_content='+encodeURIComponent(r.recomendacion.utmContent);
  show('<div class="score"><div class="lab">Tu Planeo Score</div><div class="num" id="num">'+(reduce?ps.toFixed(1):'30.0')+'</div></div>'+
    '<p class="attn">'+atn+'</p>'+radar(r)+avisoCritico(r)+ejes+ns+recomendacion(r)+
    '<div class="cta"><h2>Revisemos estas brechas juntos.</h2><p>Agenda una sesión de 30 minutos, sin costo, con un CFO de Planeo. Parte de tu resultado: ya tendremos tus respuestas a la mano.</p>'+
    '<a class="btn block" id="cta" href="'+h(href)+'" target="_blank" rel="noopener">Agendar mi sesión de 30 minutos</a>'+
    (CONFIG.BOOKINGS_URL?'':'<p class="note" style="color:#CDBBE3;margin:10px 0 0">(Demostración: falta configurar el enlace de Bookings.)</p>')+'</div>'+
    '<p class="disc">Este Planeo Score es una autoevaluación basada en tus respuestas. No es una valoración de tu empresa ni una predicción. Con tus documentos, el equipo de Planeo calcula tu Planeo Score Pro y lo compara con este resultado.</p>');
  if(!reduce){
    var t0=null, el=document.getElementById('num');
    (function paso(t){ if(!t0)t0=t; var k=Math.min(1,(t-t0)/900), e=1-Math.pow(1-k,3);
      el.textContent=(30+(ps-30)*e).toFixed(1); if(k<1) requestAnimationFrame(paso); else el.textContent=ps.toFixed(1); })(performance.now());
  }
}

/* ===== Teclado ===== */
document.addEventListener('keydown',function(e){
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var s=st.step, k=e.key.toLowerCase();
  if(s>=1 && s<=10){
    var b = k==='1'?'A':k==='2'?'P':k==='3'?'D':k==='n'?'NS':null;
    if(b){ var el=$app.querySelector('[data-v="'+b+'"]'); if(el) el.click(); }
  } else if(s===PASO_C1||s===PASO_C2){
    var i=parseInt(k,10); var els=$app.querySelectorAll('.opt'); if(i>=1&&i<=els.length) els[i-1].click();
  }
});

reintentar();
render();
})();
</script>
</body>
