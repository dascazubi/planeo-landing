:root{
  --purple:#3C0078; --purple-mid:#7A3BAA; --purple-light:#F0E8FA;
  --orange:#FF7437; --orange-dark:#CC5A20; --orange-mid:#FF9B6B;
  --text:#363636; --silver:#D4D4D4; --bg:#FAF7FD; --white:#fff;
  --red:#C62828; --amber:#F5A623; --green:#2E7D32;
  --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:var(--bg);line-height:1.5;min-height:100vh;min-height:100dvh}
header{position:fixed;top:0;left:0;right:0;z-index:20;height:52px;background:var(--purple);padding:0 20px;display:flex;align-items:center;justify-content:space-between}
header img{height:26px;width:auto;display:block}
.home{display:flex;align-items:center}
.sitio{margin-left:auto;color:#fff;font-weight:500;font-size:14px;text-decoration:none;border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:5px 14px;white-space:nowrap}
.sitio:hover,.sitio:focus-visible{background:rgba(255,255,255,.14);border-color:#fff}
.demo{margin:0 12px;font:500 11px 'DM Mono',monospace;color:#fff;background:var(--orange-dark);border-radius:99px;padding:3px 10px;display:none}
.demo.on{display:inline-block}
.progress{position:fixed;top:52px;left:0;right:0;z-index:19;display:flex;gap:6px;padding:12px 20px 0;min-height:17px}
.progress span{flex:1;height:5px;border-radius:9px;background:var(--silver);overflow:hidden;position:relative}
.progress span i{position:absolute;inset:0;background:var(--orange);transform-origin:left;transform:scaleX(0);transition:transform .35s ease}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px 120px}
main.res{justify-content:flex-start;padding-top:92px}
.screen{width:100%;max-width:680px}
.dock{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:8px;align-items:center}
.dock .arrow{width:38px;height:38px;border-radius:9px;border:0;background:var(--purple);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.dock .arrow:hover:not(:disabled){background:var(--purple-mid)}
.dock .arrow:disabled{background:var(--silver);cursor:not-allowed}
.dock .arrow:focus-visible{outline:3px solid var(--orange-mid);outline-offset:2px}
.dock .badge{font:500 12px 'DM Sans',sans-serif;background:var(--purple);color:#fff;border-radius:99px;padding:11px 16px;white-space:nowrap}
#dock.fin .arrow{display:none}
#dock.fin{position:static;justify-content:center;padding:0 0 28px}
.screen{animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font:500 13px 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--purple-mid);margin:8px 0 6px}
h1,h2{color:var(--purple);line-height:1.2;margin:.2em 0 .5em;font-weight:700}
h1{font-size:clamp(30px,4.6vw,46px)} h2{font-size:clamp(25px,3.4vw,34px)}
p{margin:.4em 0 1em}
.lead{font-size:clamp(18px,2vw,21px)}
.stmt{font-size:clamp(23px,3.2vw,34px);line-height:1.3;color:var(--text);font-weight:500;margin:8px 0 28px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:clamp(17px,1.8vw,20px);text-align:left;width:100%;background:var(--white);color:var(--text);border:2px solid var(--silver);border-radius:var(--radius);padding:15px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s,transform .1s;min-height:56px}
.opt:hover{border-color:var(--purple-mid)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--purple);background:var(--purple-light)}
.opt kbd{font:500 12px 'DM Mono',monospace;color:var(--purple-mid);border:1px solid var(--silver);border-radius:6px;padding:1px 7px;flex:none}
.opt.extra{border-style:dashed;font-size:clamp(16px,1.7vw,18px)}
.ns{display:block;margin:16px auto 0;background:none;border:0;font:inherit;font-size:15px;color:var(--purple-mid);text-decoration:underline;cursor:pointer;padding:10px}
.ns.sel{color:var(--purple);font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.back{background:none;border:0;font:inherit;color:var(--purple-mid);cursor:pointer;padding:8px 4px;font-size:15px}
.back[hidden]{visibility:hidden;display:block}
.btn{font:inherit;font-weight:700;font-size:17px;background:var(--orange);color:#fff;border:0;border-radius:99px;padding:15px 28px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:background .15s}
.btn:hover{background:var(--orange-dark)}
.btn:disabled{background:var(--silver);cursor:not-allowed}
.btn.block{display:block;width:100%}
.group{margin:0 0 20px}
.group>label,.group>.lab{display:block;font-weight:700;color:var(--purple);margin-bottom:8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:clamp(15px,1.6vw,17px);background:var(--white);border:2px solid var(--silver);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip.sel{border-color:var(--purple);background:var(--purple-light);color:var(--purple);font-weight:700}
input[type=text],input[type=email]{font:inherit;font-size:clamp(17px,1.8vw,19px);width:100%;border:2px solid var(--silver);border-radius:var(--radius);padding:13px 14px;background:#fff;color:var(--text)}
input:focus,.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.ns:focus-visible,.back:focus-visible{outline:3px solid var(--orange-mid);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0 18px}
.consent input{width:22px;height:22px;margin-top:2px;accent-color:var(--purple);flex:none}
.consent a{color:var(--purple-mid)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{color:var(--red);font-size:14px;min-height:20px;margin:0 0 8px}
.note{font-size:clamp(14px,1.5vw,16px);color:#666}
/* Resultado */
.score{text-align:center;margin:6px 0 4px}
.score .lab{font-weight:700;color:var(--purple);font-size:22px}
.score .num{font:500 82px/1 'DM Mono',monospace;color:var(--orange);margin:6px 0}
.nivel{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--purple);background:#fff;border:1.5px solid var(--silver);border-radius:999px;padding:6px 16px;margin:4px 0 10px}
.nivel i{width:12px;height:12px;border-radius:50%;display:block}
.attn{text-align:center;font-weight:500;margin:0 0 8px}
.radar{display:block;width:100%;max-width:560px;margin:0 auto}
.axis{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--silver)}
.axis:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.axis b{color:var(--purple)}
.axis .v{font:500 14px 'DM Mono',monospace;color:#666;margin-left:6px}
.axis p{margin:2px 0 0;font-size:15px}
.crit{background:#FFF1EA;border-left:5px solid var(--orange);border-radius:10px;padding:14px 16px;margin:16px 0}
.crit p{margin:0}
.card{background:var(--white);border:1px solid var(--silver);border-radius:var(--radius);padding:16px 18px;margin:16px 0}
.card ul{margin:.4em 0 0;padding-left:20px;font-size:15px}
.rec{background:var(--purple-light);border-radius:var(--radius);padding:16px 18px;margin:16px 0}
.cta{background:var(--purple);color:#fff;border-radius:var(--radius);padding:20px;margin:18px 0}
.cta h2{color:#fff;margin-top:0}
.cta p{color:#EDE3F7}
.disc{font-size:14px;color:#666;border-top:1px solid var(--silver);padding-top:14px;margin-top:22px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #fff;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){h1{font-size:25px}.stmt{font-size:20px}.row2{grid-template-columns:1fr}}
</style>

/* Planeo Score (versión ligera) — motor de cálculo. Metodología v26.

 * UMD: funciona en navegador (window.PlaneoScoring) y en Node (require). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PlaneoScoring = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var VERSION_METODOLOGIA = 'v27';
  var VERSION_FORMULARIO = 'v1';

  var EJES = ['L', 'R', 'RE', 'E', 'G'];
  var PESOS = { L: 0.25, R: 0.25, RE: 0.20, E: 0.15, G: 0.15 };
  var NOMBRES = { L: 'Caja', R: 'Márgenes', RE: 'Dependencia y deuda', E: 'Recursos', G: 'Crecimiento' };
  var NOMBRES_TECNICOS = { L: 'Liquidez', R: 'Rentabilidad', RE: 'Riesgo Estructural', E: 'Eficiencia', G: 'Crecimiento' };

  // pol: 'P' positiva (De acuerdo = 2) | 'N' negativa (De acuerdo = 0)
  var ITEMS = [
    { codigo: 'L1',  eje: 'L',  pol: 'N' },
    { codigo: 'L2',  eje: 'L',  pol: 'P' },
    { codigo: 'R1',  eje: 'R',  pol: 'P' },
    { codigo: 'R2',  eje: 'R',  pol: 'P' },
    { codigo: 'RE1', eje: 'RE', pol: 'P' },
    { codigo: 'RE2', eje: 'RE', pol: 'P', extra: 'ND' },
    { codigo: 'E1',  eje: 'E',  pol: 'N' },
    { codigo: 'E2',  eje: 'E',  pol: 'N' },
    { codigo: 'G1',  eje: 'G',  pol: 'P', extra: 'JOVEN' },
    { codigo: 'G2',  eje: 'G',  pol: 'P' }
  ];

  var UMBRAL_ALERTA = { L: 55, R: 45, RE: 45, E: 45, G: 45 };
  var UMBRAL_ATENCION = 60;
  var PISO = 30;

  var C1_VALORES = ['SI', 'CONSIDERADO', 'NO'];
  var C2_VALORES = ['ALTA', 'MEDIA', 'BAJA']; // confianza autorreportada de la contabilidad

  function itemPorCodigo(c) {
    for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].codigo === c) return ITEMS[i];
    return null;
  }

  function puntosItem(item, valor) {
    switch (valor) {
      case 'A': return item.pol === 'P' ? 2 : 0;
      case 'P': return 1;
      case 'D': return item.pol === 'P' ? 0 : 2;
      case 'NS': return 0;
      case 'ND': return item.extra === 'ND' ? 2 : null;
      case 'JOVEN': return item.extra === 'JOVEN' ? 1 : null;
      default: return null;
    }
  }

  function redondear(x, d) { var m = Math.pow(10, d); return Math.round(x * m + 1e-9) / m; }

  /* Valida respuestas. Devuelve {ok, errores[]}. */
  function validar(respuestas, contexto) {
    var errores = [];
    if (!respuestas || typeof respuestas !== 'object') return { ok: false, errores: ['respuestas'] };
    ITEMS.forEach(function (it) {
      if (puntosItem(it, respuestas[it.codigo]) === null) errores.push(it.codigo);
    });
    if (contexto) {
      if (contexto.C1 != null && C1_VALORES.indexOf(contexto.C1) < 0) errores.push('C1');
      if (contexto.C2 != null && C2_VALORES.indexOf(contexto.C2) < 0) errores.push('C2');
    }
    return { ok: errores.length === 0, errores: errores };
  }

  /* respuestas: {L1:'A',...}; contexto: {C1:'SI|CONSIDERADO|NO', C2:'ALTA|MEDIA|BAJA'} */
  function calcular(respuestas, contexto) {
    contexto = contexto || {};
    var v = validar(respuestas, contexto);
    if (!v.ok) { var e = new Error('Respuestas inválidas: ' + v.errores.join(',')); e.invalidos = v.errores; throw e; }

    var puntosPorItem = {}, pts = { L: 0, R: 0, RE: 0, E: 0, G: 0 }, noSabe = [];
    ITEMS.forEach(function (it) {
      var p = puntosItem(it, respuestas[it.codigo]);
      puntosPorItem[it.codigo] = p;
      pts[it.eje] += p;
      if (respuestas[it.codigo] === 'NS') noSabe.push(it.codigo);
    });

    var eje = {}, suma = 0;
    EJES.forEach(function (k) {
      var norm = pts[k] / 4 * 100;
      eje[k] = redondear(PISO + 0.7 * norm, 1);
      suma += PESOS[k] * Math.log(PISO + 0.7 * norm);
    });
    var ps = redondear(Math.exp(suma), 1);

    var alertas = EJES.filter(function (k) { return eje[k] < UMBRAL_ALERTA[k]; });
    var atencion = EJES.filter(function (k) { return eje[k] < UMBRAL_ATENCION; });

    var tipo = eje.L < UMBRAL_ATENCION ? 'CICLO_CAJA' : 'CFO_EXTERNO';
    var otrosEjes = atencion.filter(function (k) { return k !== 'L'; });

    var valoracion = null;
    if (contexto.C1 && contexto.C1 !== 'NO') {
      // Comercial v18: C1 define la necesidad y C2 la viabilidad. Completa solo con conversación en curso y contabilidad al día.
      valoracion = (contexto.C1 === 'SI' && contexto.C2 === 'ALTA') ? 'COMPLETA' : 'EXPRESS';
    }

    var utm = tipo === 'CICLO_CAJA' ? 'ciclo-caja' : 'cfo-externo';
    if (valoracion) utm += '_val-' + (valoracion === 'COMPLETA' ? 'completa' : 'express');

    return {
      versionMetodologia: VERSION_METODOLOGIA,
      pts: pts,
      puntosPorItem: puntosPorItem,
      eje: eje,
      planeoScore: ps,
      alertas: alertas,
      atencion: atencion,
      noSabe: noSabe,
      recomendacion: { tipo: tipo, otrosEjes: otrosEjes, valoracion: valoracion, utmContent: utm }
    };
  }

  return {
    VERSION_METODOLOGIA: VERSION_METODOLOGIA, VERSION_FORMULARIO: VERSION_FORMULARIO,
    EJES: EJES, PESOS: PESOS, NOMBRES: NOMBRES, NOMBRES_TECNICOS: NOMBRES_TECNICOS,
    ITEMS: ITEMS, C1_VALORES: C1_VALORES, C2_VALORES: C2_VALORES,
    UMBRAL_ALERTA: UMBRAL_ALERTA, UMBRAL_ATENCION: UMBRAL_ATENCION, PISO: PISO,
    puntosItem: puntosItem, validar: validar, calcular: calcular
  };
});

/* ===== Resultado ===== */
function radar(r){
  var cx=170, cy=158, R=104, ks=S.EJES;
  function pt(i,v){ var a=(-90+i*72)*Math.PI/180, rr=(v-30)/70*R; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; }
  function poly(v){ return ks.map(function(_,i){return pt(i,v).map(function(n){return n.toFixed(1);}).join(',');}).join(' '); }
  var svg='<svg class="radar" viewBox="-50 0 440 320" role="img" aria-label="Radar de tus cinco áreas">';
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((60-30)/70*R).toFixed(1)+'" fill="'+'#FF7437'+'" fill-opacity=".12"/>';
  svg+='<polygon points="'+poly(100)+'" fill="none" stroke="#D4D4D4"/>';
  svg+='<polygon points="'+poly(60)+'" fill="none" stroke="#FF9B6B" stroke-dasharray="4 3"/>';
  ks.forEach(function(_,i){ var p=pt(i,100); svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#D4D4D4"/>'; });
  svg+='<polygon points="'+ks.map(function(k,i){return pt(i,r.eje[k]).map(function(n){return n.toFixed(1);}).join(',');}).join(' ')+'" fill="#3C0078" fill-opacity=".22" stroke="#3C0078" stroke-width="2.5" stroke-linejoin="round"/>';
  ks.forEach(function(k,i){
    var p=pt(i,r.eje[k]), crit=r.alertas.indexOf(k)>=0;
    svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(crit?6.5:4.5)+'" fill="'+(crit?'#FF7437':'#3C0078')+'" stroke="#fff" stroke-width="1.5"/>';
    var a=(-90+i*72)*Math.PI/180, lx=cx+(R+20)*Math.cos(a), ly=cy+(R+20)*Math.sin(a);
    var anchor=Math.abs(Math.cos(a))<.2?'middle':(Math.cos(a)>0?'start':'end');
    var partes = TITULOS[k]==='Dependencia y deuda' ? ['Dependencia','y deuda'] : [TITULOS[k]];
    var dy = Math.sin(a)>.5 ? 14 : (Math.sin(a)<-.5 ? -6-(partes.length-1)*15 : 5-(partes.length-1)*9);
    svg+='<text x="'+lx.toFixed(1)+'" y="'+(ly+dy).toFixed(1)+'" text-anchor="'+anchor+'" font-size="14" font-weight="700" fill="'+(crit?'#CC5A20':'#3C0078')+'" font-family="DM Sans,sans-serif">'+
      partes.map(function(t,j){return '<tspan x="'+lx.toFixed(1)+'" dy="'+(j?15:0)+'">'+t+'</tspan>';}).join('')+'</text>';
  });
  return svg+'</svg>';
}
function avisoCritico(r){
  if(!r.alertas.length) return '';
  var al=r.alertas, caja=al.indexOf('L')>=0, otros=al.filter(function(k){return k!=='L';});
  var tit = al.length===1 ? 'Eje crítico: '+TITULOS[al[0]]+' ('+r.eje[al[0]].toFixed(1)+').' : 'Ejes críticos: '+lista(nombres(al))+'.';
  var frase;
  if(al.length===1){
    frase = caja ? 'la caja podría comprometer la operación en el corto plazo si no se atiende' : 'esta área está restando valor a tu empresa de forma significativa';
  } else {
    var partes=[];
    if(caja) partes.push('la caja podría comprometer la operación en el corto plazo si no se atiende');
    if(otros.length) partes.push(lista(nombres(otros))+(otros.length>1?' están restando':' está restando')+' valor a tu empresa de forma significativa');
    frase = partes.join(', y ');
  }
  var cuerpo = 'Según tus respuestas, '+frase+'. Es lo primero que revisaremos contigo en la sesión sin costo.';
  return '<div class="crit"><p><b>'+tit+'</b> '+cuerpo+'</p></div>';
}
function recomendacion(r){
  var rec=r.recomendacion, o=nombres(rec.otrosEjes), t='';
  var val = rec.valoracion ? '<b>Valoración '+(rec.valoracion==='COMPLETA'?'Completa':'Express')+'</b>' : '';
  if(rec.tipo==='CICLO_CAJA'){
    t='Te recomendamos empezar por un <b>Programa de Optimización de Ciclo de Caja</b>: ordenar cobros, pagos e inventario, y definir un nivel mínimo de caja que proteja la operación.'+(o.length?' Una vez estabilizada la caja, trabajaríamos en '+lista(o)+'.':'');
    // Comercial v18: con la caja en rojo, la valoración va en secuencia, después de estabilizar la caja
    if(val) t+= o.length
      ? ' Después, te recomendamos una '+val+': así el valor de tu empresa reflejará una operación ordenada.'
      : ' Una vez estabilizada la caja, te recomendamos una '+val+': así el valor de tu empresa reflejará una operación ordenada.';
    return '<div class="rec"><p style="margin:0">'+t+'</p></div>';
  } else if(nivel(r.eje.L)===0){
    t='Tu caja está sana, lo que permite enfocarse en la rentabilidad y el crecimiento. Te recomendamos un servicio de <b>CFO Externo</b> '+(o.length?'que trabaje contigo en '+lista(o):'que te acompañe a sostener estos resultados e identificar nuevas oportunidades')+'.';
  } else {
    t='Tu caja no presenta un riesgo inmediato, aunque opera con poco margen. Te recomendamos un servicio de <b>CFO Externo</b> que trabaje contigo en fortalecerla'+(o.length?' y en '+lista(o):'')+'.';
  }
  if(val){
    t+= st.ctx.C1==='SI'
      ? ' Dado que tienes conversaciones en curso de venta, entrada de socio o sucesión, te recomendamos además una '+val+' para negociar con una referencia objetiva del valor de tu empresa.'
      : ' Como has considerado una venta, la entrada de un socio o una sucesión, te recomendamos además una '+val+' para conocer cuánto vale hoy tu empresa y qué factores lo determinan.';
  }
  return '<div class="rec"><p style="margin:0">'+t+'</p></div>';
}
function pResultado(){
  var r=st.result, ps=r.planeoScore;
  var ambar = S.EJES.filter(function(k){return nivel(r.eje[k])===1;});
  var atn = r.atencion.length ? 'Áreas que requieren atención: '+lista(nombres(r.atencion))+'.'
          : (ambar.length ? 'Ninguna área está en zona de riesgo. '+lista(nombres(ambar))+(ambar.length>1?' tienen':' tiene')+' espacio de mejora.'
          : 'Tus cinco áreas muestran una situación sólida.');
  var hayRojo=S.EJES.some(function(k){return nivel(r.eje[k])===2;});
  var nvT=nivel(ps); if(nvT===0 && hayRojo) nvT=1; // el total no puede ser verde si hay un eje en rojo
  var etiqueta=['Fuerte','Aceptable','Débil'][nvT], colT=['var(--green)','var(--amber)','var(--red)'][nvT];
  var ejes=S.EJES.map(function(k){
    var v=r.eje[k], nv=nivel(v), col=['var(--green)','var(--amber)','var(--red)'][nv];
    return '<div class="axis"><span class="dot" style="background:'+col+'"></span><div><b>'+TITULOS[k]+'</b><span class="v">'+v.toFixed(1)+'</span><p>'+LECTURA[k][nv]+'</p></div></div>';
  }).join('');
  var ns='';
  if(r.noSabe.length){
    var uno = r.noSabe.length===1;
    ns='<div class="card"><b>Respondiste «No lo sé» en '+r.noSabe.length+(uno?' afirmación':' afirmaciones')+'.</b> Esto también es un hallazgo: no contar con '+(uno?'este dato':'estos datos')+' limita la toma de decisiones. '+(uno?'Lo':'Los')+' precisamos contigo a partir de tus documentos. '+(uno?'Tema':'Temas')+' sin visibilidad:<ul>'+
      r.noSabe.map(function(c){return '<li>'+HALLAZGO[c]+'</li>';}).join('')+'</ul></div>';
  }
  var href='#';
  if(CONFIG.BOOKINGS_URL) href=CONFIG.BOOKINGS_URL+(CONFIG.BOOKINGS_URL.indexOf('?')>=0?'&':'?')+'utm_content='+encodeURIComponent(r.recomendacion.utmContent);
  show('<div class="score"><div class="lab">Planeo Score</div><div class="num" id="num">'+(reduce?ps.toFixed(1):'30.0')+'</div><div class="nivel"><i style="background:'+colT+'"></i>'+etiqueta+'</div></div>'+
    '<p class="attn">'+atn+'</p>'+radar(r)+avisoCritico(r)+ejes+ns+recomendacion(r)+
    '<div class="cta"><h2>Conversemos sobre tu resultado.</h2><p>Agenda una sesión de 30 minutos, sin costo, con un CFO de Planeo. Llegaremos con tus respuestas revisadas para enfocarnos en lo que más impacto tiene en tu empresa.</p>'+
    '<a class="btn block" id="cta" href="'+h(href)+'" target="_blank" rel="noopener">Agendar mi sesión de 30 minutos</a>'+
    (CONFIG.BOOKINGS_URL?'':'<p class="note" style="color:#CDBBE3;margin:10px 0 0">(Demostración: falta configurar el enlace de Bookings.)</p>')+'</div>'+
    '<p class="disc">Este Planeo Score es una autoevaluación basada en tus respuestas. No constituye una valoración de tu empresa ni una predicción de resultados. Con tu información financiera, el equipo de Planeo puede calcular el Planeo Score Pro, basado en métricas objetivas, para obtener una visión más precisa y completa de tu situación financiera.</p>');
  var cta=document.getElementById('cta');
  if(cta && CONFIG.API_URL) cta.addEventListener('click',function(){ post('/diagnostico/clic',{sesionId:st.sid},6000).catch(function(){}); });
  if(!reduce){
    var t0=null, el=document.getElementById('num');
    (function paso(t){ if(!t0)t0=t; var k=Math.min(1,(t-t0)/900), e=1-Math.pow(1-k,3);
      el.textContent=(30+(ps-30)*e).toFixed(1); if(k<1) requestAnimationFrame(paso); else el.textContent=ps.toFixed(1); })(performance.now());
  }
}

/* ===== Teclado ===== */
document.addEventListener('keydown',function(e){
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var s=st.step, k=e.key.toLowerCase();
  if(s>=1 && s<=10){
    var b = k==='1'?'A':k==='2'?'P':k==='3'?'D':k==='n'?'NS':null;
    if(b){ var el=$app.querySelector('[data-v="'+b+'"]'); if(el) el.click(); }
  } else if(s===PASO_C1||s===PASO_C2){
    var i=parseInt(k,10); var els=$app.querySelectorAll('.opt'); if(i>=1&&i<=els.length) els[i-1].click();
  }
});

reintentar();
render();
dock();
})();
</script>
